name: update-ai-loon
on:
  schedule:
    - cron: "27 20 * * *"   # 每天 04:27 CST（与 scamsniffer 错开）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ai.list
          git diff --cached --quiet || git commit -m "auto update $(date -u +%F)"
          git push
